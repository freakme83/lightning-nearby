app = "lightning-nearby-ankara-shadow"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.fly-ankara-worker"

[env]
  NODE_ENV = "production"

[processes]
  app = "node --experimental-strip-types scripts/fly-ankara-worker/worker.ts"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
