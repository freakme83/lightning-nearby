app = "lightning-nearby-dual-source-shadow"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.fly-dual-source-observer"

[env]
  NODE_ENV = "production"

[processes]
  observer = "node --experimental-strip-types scripts/research/dual-source-observer/runner.ts"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
