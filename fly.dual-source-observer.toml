app = "lightning-nearby-dual-source-shadow"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.fly-dual-source-observer"

[env]
  NODE_ENV = "production"

[processes]
  observer = "node --experimental-strip-types scripts/research/dual-source-observer/runner.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["observer"]

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
